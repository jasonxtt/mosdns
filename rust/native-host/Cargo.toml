[package]
name = "mosdns-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mosdns"
path = "src/main.rs"

[[bin]]
name = "mosdns-settings-migrate"
path = "src/bin/settings_migrate.rs"

[dependencies]
fs2 = "=0.4.3"
flate2 = "=1.1.9"
hickory-proto = { version = "0.25.2", default-features = false }
# Rule-source downloads (M1-a2): the same reviewed pins `mosdns-upstream-core`
# already resolves (HTTP/1.1 client connection only, no pooled client).
http-body-util = { version = "=0.1.3", default-features = false }
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
mosdns-cache-core = { path = "../cache-core" }
mosdns-dns-core = { path = "../dns-core" }
mosdns-matcher-core = { path = "../matcher-core" }
mosdns-sequence-core = { path = "../sequence-core" }
mosdns-upstream-core = { path = "../upstream-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
socket2 = "0.6"
ring = "=0.17.14"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "signal"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
url = "2"
yaml_serde = "=0.10.7"

[dev-dependencies]
base64 = "=0.22.1"
bytes = "1"
h2 = "=0.4.19"
http = "1"
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

[build-dependencies]
ring = "=0.17.14"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "thread"] }
