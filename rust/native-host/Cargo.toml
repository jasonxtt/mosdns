[package]
name = "mosdns-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mosdns"
path = "src/main.rs"

[dependencies]
flate2 = "=1.1.9"
hickory-proto = { version = "0.25.2", default-features = false }
mosdns-cache-core = { path = "../cache-core" }
mosdns-dns-core = { path = "../dns-core" }
mosdns-matcher-core = { path = "../matcher-core" }
mosdns-sequence-core = { path = "../sequence-core" }
mosdns-upstream-core = { path = "../upstream-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "signal"] }
url = "2"
yaml_serde = "=0.10.7"

[dev-dependencies]
base64 = "=0.22.1"
bytes = "1"
h2 = "=0.4.19"
http = "1"
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
