[package]
name = "mosdns-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mosdns"
path = "src/main.rs"

[dependencies]
mosdns-cache-core = { path = "../cache-core" }
mosdns-dns-core = { path = "../dns-core" }
mosdns-matcher-core = { path = "../matcher-core" }
mosdns-sequence-core = { path = "../sequence-core" }
mosdns-upstream-core = { path = "../upstream-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt"] }
yaml_serde = "=0.10.7"

[lints]
workspace = true
