[package]
name = "mosdns-upstream-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mosdns_upstream_core"
crate-type = ["rlib"]

[dependencies]
mosdns-dns-core = { path = "../dns-core" }
# Phase 4 resolver endpoint resolution: unpredictable bootstrap DNS transaction
# IDs. Only `fill` is used, to draw the two ID octets. Default features are
# disabled because the crate declares no default feature set, and only `std`
# is enabled for error/std integration. Resolved lock: getrandom 0.4.3
# (MIT OR Apache-2.0, MSRV 1.85, edition 2024) - at the workspace MSRV, not
# above it. This was already present in the lock as a transitive dependency of
# uuid/moka, so making it direct adds no new crate to the resolved graph.
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
# Slice1 production async I/O: `net` for the per-exchange UdpSocket, `time`
# for the one absolute-deadline sleep, `rt` for runtime-owned I/O/select
# support, `sync` for the close/drain Notify wake primitive, and `macros` for
# tokio::select!/tokio::pin!. upstream-core runs on the caller's runtime and
# still creates no runtime, executor, or timer of its own.
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
# Slice0 secure endpoint construction: only the structured URL parser is used;
# no TLS/HTTP crate is introduced in this slice. The committed lock file holds
# the transitive `idna_adapter` at 1.1.0 because the ICU-backed 1.2.x line
# declares a 1.86+ MSRV, above this workspace's 1.85.
url = "2"
# Slice0 pure DoH GET request-target encoding. Default features are disabled so
# the crate brings in no `std`-only surface beyond the reviewed `alloc` string
# encoder; only `general_purpose::URL_SAFE_NO_PAD` is used and no decode path is
# compiled for production. Resolved lock: base64 0.22.1 (MIT OR Apache-2.0,
# MSRV 1.48.0), below the workspace MSRV of 1.85.
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
# Slice0 secure TLS policy preflight. Only the client policy type is needed, so
# the TLS engine is added without its aws-lc-rs/post-quantum/logging defaults.
# `ring` is the reviewed safe provider, `std` enables std integration, and
# `tls12` keeps TLS 1.2 available under rustls' safe defaults. Resolved lock:
# rustls 0.23.45 (Apache-2.0 OR ISC OR MIT, MSRV 1.71), ring 0.17.14
# (Apache-2.0 AND ISC, MSRV 1.66.0) - both below the workspace MSRV of 1.85.
# Slice0 adds only the reviewed dependency graph; no TLS socket I/O is
# implemented by this slice.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Slice0 secure endpoint/HTTP dependency review. Exact pins preserve the
# reviewed lock: hyper 1.11.0 (MIT, MSRV 1.63), hyper-util 0.1.20 (MIT, MSRV
# 1.64), http-body-util 0.1.3 (MIT, MSRV 1.61), tokio-rustls 0.26.4
# (MIT OR Apache-2.0, MSRV 1.71) - all below the workspace MSRV of 1.85.
# hyper exposes the low-level HTTP/1.1+HTTP/2 client connection APIs; hyper-util
# contributes only the `tokio` IO/executor adapter. No `client`,
# `client-legacy` or `client-pool` feature is enabled, so no high-level pooled
# or retrying client is pulled in. tokio-rustls reuses the same `ring`/`tls12`
# rustls selection as above and never enables aws-lc-rs.
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.3", default-features = false }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
# Slice 0 QUIC/HTTP3 dependency review (DoQ streams + DoH3 client layer).
# Exact pins preserve the reviewed lock: quinn =0.11.7 (MIT OR Apache-2.0,
# rust-version 1.71), quinn-proto 0.11.x / quinn-udp 0.5.x via quinn (same
# license family), h3 =0.0.8 (MIT, MSRV 1.70), h3-quinn =0.0.10 (MIT, MSRV
# 1.70, depends on quinn 0.11.7) — all below the workspace MSRV of 1.85.
# Default features are disabled and this manifest requests only `runtime-tokio`
# + `rustls-ring`: this excludes `platform-verifier` (platform trust-store
# auto-loading would violate the caller-supplied-roots contract) and never
# enables `aws-lc-rs` (a second crypto provider beside the reviewed `ring`).
# Note the resolved set additionally contains quinn's `futures-io` feature,
# requested by h3-quinn itself (poll adapters on quinn stream types, driven
# from the caller's task - not another runtime; see the Slice 0 audit doc).
# quinn's rustls is 0.23.5, the same 0.23 line the workspace `rustls` builds
# the frozen `TlsPolicy` from, so no second rustls major enters the graph.
# h3/h3-quinn have their default features disabled. The h3 opt-in API feature
# is intentionally enabled for Slice 2: the shared DoH3 owner must bind the
# pinned `RemoteClosing`/`ConnectionError` provenance at the real
# `SendRequest` boundary rather than infer it from a wildcard or a rendered
# error. This does not change the locked version or enable tracing/datagram.
# Slice 0 resolves and audits this graph only; no QUIC socket I/O is
# implemented by this slice.
quinn = { version = "=0.11.7", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = { version = "=0.0.8", default-features = false, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = { version = "=0.0.10", default-features = false }

[dev-dependencies]
# Slice1 synthetic certificate fixtures. Declared as a dev-dependency only, so
# it never enters the library's normal graph and cannot reach the production
# secure modules. Default features are disabled and only `ring` is enabled,
# reusing the same crypto provider the client already uses, so no aws-lc-rs or
# OpenSSL backend and no `pem` encoder is pulled in.
#
# Do not read `x509-parser` out of `Cargo.lock`. In the published rcgen 0.14.7
# manifest `x509-parser` is `optional = true`, so Cargo also creates an implicit
# same-named feature (`x509-parser = ["dep:x509-parser"]`) that would activate
# it; that feature is simply not selected here, since this crate enables only
# `ring`. Every *declared* reference to it in rcgen's own feature table is a weak
# reference (`x509-parser?/verify`, `x509-parser?/verify-aws`), and a weak
# reference does not activate the dependency by itself. So no enabled rcgen
# feature activates `dep:x509-parser`: `cargo tree -p rcgen -e features` lists
# only `ring`, `rustls-pki-types`, `time` and `yasna` under rcgen. The lockfile
# still records it as a resolution superset, which is why the lock-only
# license/MSRV audit below covers it.
#
# Activated graph: rcgen 0.14.7 (MIT OR Apache-2.0, MSRV 1.71) plus ring,
# rustls-pki-types, yasna, and the `time` family, with resolver 3 holding
# time/time-core at 0.3.45/0.1.7 (MSRV 1.83.0) and deranged at 0.5.8 (MSRV
# 1.85.0) rather than the 1.88-requiring newer lines. Nothing activated by this
# dev-dependency is above the workspace MSRV of 1.85. This crate is used only by
# `tests/`; no production code imports it, and `cargo tree -e normal` shows
# neither rcgen nor x509-parser for the crate or the workspace.
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"] }
# Slice3 loopback-only HTTP/2 server for the client/executor contract tests.
h2 = "=0.4.19"
# Test-only driver for the Slice1 UDP contract tests: a bounded current-thread
# runtime plus async wake/timeout primitives. Mock servers use blocking
# std::net::UdpSocket tasks and the library still creates no Tokio runtime.
tokio = { version = "1", features = ["rt", "sync", "time"] }

[lints]
workspace = true
