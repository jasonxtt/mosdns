name: Docker

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'docker-compose*.yml.example'
      - 'scripts/check-docker-release.sh'
      - 'scripts/test-docker-release.sh'
      - 'scripts/test-container.py'
      - 'coremain/**'
      - 'plugin/**'
      - 'pkg/**'
      - 'mlog/**'
      - 'webui-log/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source and read build metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch origin main:refs/remotes/origin/main
            scripts/check-docker-release.sh "$RELEASE_TAG" HEAD refs/remotes/origin/main
            VERSION="$RELEASE_TAG"
          else
            VERSION="dev-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui-log/package-lock.json

      - name: Build embedded WebUI
        working-directory: webui-log
        env:
          MOSDNS_ASSET_VERSION: ${{ steps.meta.outputs.commit }}
        run: |
          npm ci
          npm run build
          npm run build:log1

      - name: Test backend and release guard
        run: |
          go test ./...
          scripts/test-docker-release.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile_buildx
          platforms: linux/amd64
          load: true
          push: false
          tags: mosdns:ci-test
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.built_at }}
            VCS_REF=${{ steps.meta.outputs.commit }}
            MOSDNS_ASSET_VERSION=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container runtime
        run: python3 scripts/test-container.py mosdns:ci-test

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile_buildx
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            jasonxtt/mosdns-t:${{ steps.meta.outputs.version }}
            jasonxtt/mosdns-t:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.built_at }}
            VCS_REF=${{ steps.meta.outputs.commit }}
            MOSDNS_ASSET_VERSION=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published manifest
        if: github.event_name == 'push'
        env:
          IMAGE: jasonxtt/mosdns-t:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"
