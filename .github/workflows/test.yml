name: Test mosdns (Rust)

# Manual only (user decision 2026-10-18): run from the Actions tab or
# `gh workflow run test.yml --ref rust`.
on:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        # Pinned to the toolchain the code is linted with locally; newer clippy
        # releases add lints. Bump deliberately together with the lint fixes.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - name: Format, lint and test
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --no-fail-fast --locked

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui-log/package-lock.json
      - name: Test and build the WebUI
        working-directory: webui-log
        run: |
          npm ci --include=dev
          node --test tests/*.test.mjs
          npm run build
