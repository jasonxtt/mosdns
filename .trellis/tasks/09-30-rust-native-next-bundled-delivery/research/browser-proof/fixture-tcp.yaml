log:
  level: error

api:
  http: "127.0.0.1:25100"

plugins:
  - tag: browser_forward
    type: forward
    args:
      upstreams:
        - addr: "tcp://1.1.1.1:53"

  - tag: browser_entry
    type: sequence
    args:
      - exec: $browser_forward

  - tag: browser_tcp
    type: tcp_server
    args:
      entry: browser_entry
      listen: "127.0.0.1:25054"
      idle_timeout: 2
      enable_audit: true
